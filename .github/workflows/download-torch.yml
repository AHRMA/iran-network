name: Download PyTorch Wheel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger
  schedule:
    # Run weekly to check for updates (optional)
    - cron: '0 0 * * 0'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for commit tracking
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Download PyTorch wheel
      run: |
        python download_torch_wheel.py
    
    - name: Create GitHub Release Asset
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        tag_name: pyroch-wheels-latest
        name: "PyTorch Wheels - Latest"
        files: downloads/*.whl
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pytorch-wheel
        path: downloads/*.whl
        retention-days: 90  # Keep for 90 days
