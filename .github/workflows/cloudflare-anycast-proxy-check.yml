name: Cloudflare Anycast Proxy Check

on:
  workflow_dispatch:
    inputs:
      max_failures:
        description: Maximum number of unusable ranges allowed before failing
        required: false
        default: "0"
      sample_ips_per_range:
        description: Number of sample IPs to test per CIDR range
        required: false
        default: "1"
      connect_timeout:
        description: Connect timeout in seconds
        required: false
        default: "5"
  schedule:
    - cron: "0 */12 * * *"

jobs:
  check-anycast-proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAX_FAILURES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_failures || '0' }}
      SAMPLE_IPS_PER_RANGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sample_ips_per_range || '1' }}
      CONNECT_TIMEOUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.connect_timeout || '5' }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Cloudflare ranges and check proxy usability
        run: |
          python - <<'PY'
          import ipaddress
          import json
          import os
          import socket
          import ssl
          import urllib.request
          from datetime import datetime, timezone

          RANGE_URLS = {
              "ipv4": "https://www.cloudflare.com/ips-v4",
              "ipv6": "https://www.cloudflare.com/ips-v6",
          }
          TARGET_HOST = "www.cloudflare.com"
          TARGET_PATH = "/cdn-cgi/trace"
          OUTPUT_JSON = "cloudflare-anycast-proxy-report.json"
          OUTPUT_MD = "cloudflare-anycast-proxy-report.md"

          max_failures = int(os.getenv("MAX_FAILURES", "0"))
          sample_ips_per_range = max(1, int(os.getenv("SAMPLE_IPS_PER_RANGE", "1")))
          connect_timeout = float(os.getenv("CONNECT_TIMEOUT", "5"))

          def fetch_ranges(url):
              with urllib.request.urlopen(url, timeout=15) as response:
                  text = response.read().decode("utf-8")
              return [line.strip() for line in text.splitlines() if line.strip()]

          def sample_ips(cidr, count):
              network = ipaddress.ip_network(cidr)
              if network.num_addresses == 1:
                  return [str(network.network_address)]
              hosts_iter = network.hosts()
              ips = []
              for _ in range(count):
                  try:
                      ips.append(str(next(hosts_iter)))
                  except StopIteration:
                      break
              return ips or [str(network.network_address)]

          def check_ip(ip):
              family = socket.AF_INET6 if ":" in ip else socket.AF_INET
              addr = (ip, 443, 0, 0) if family == socket.AF_INET6 else (ip, 443)
              sock = None
              tls_sock = None
              try:
                  sock = socket.socket(family, socket.SOCK_STREAM)
                  sock.settimeout(connect_timeout)
                  sock.connect(addr)

                  context = ssl.create_default_context()
                  tls_sock = context.wrap_socket(sock, server_hostname=TARGET_HOST)
                  req = (
                      f"GET {TARGET_PATH} HTTP/1.1\r\n"
                      f"Host: {TARGET_HOST}\r\n"
                      "User-Agent: github-actions-cf-anycast-check/1.0\r\n"
                      "Connection: close\r\n\r\n"
                  ).encode("ascii")
                  tls_sock.sendall(req)
                  response_head = b""
                  while b"\r\n\r\n" not in response_head and len(response_head) < 8192:
                      chunk = tls_sock.recv(64)
                      if not chunk:
                          break
                      response_head += chunk

                  first_line = response_head.split(b"\r\n", 1)[0].decode("iso-8859-1", errors="replace").strip()
                  if not first_line:
                      return False, "no_http_response"
                  status_line = first_line
                  parts = status_line.split()
                  if len(parts) < 2 or not parts[1].isdigit():
                      return False, f"invalid_http_status_line:{status_line}"
                  return True, f"http_{parts[1]}"
              except Exception as exc:
                  return False, type(exc).__name__
              finally:
                  if tls_sock is not None:
                      try:
                          tls_sock.close()
                      except Exception:
                          pass
                  elif sock is not None:
                      try:
                          sock.close()
                      except Exception:
                          pass

          all_ranges = []
          for family, url in RANGE_URLS.items():
              for cidr in fetch_ranges(url):
                  all_ranges.append({"family": family, "cidr": cidr})

          checks = []
          unusable_ranges = 0
          for entry in all_ranges:
              cidr = entry["cidr"]
              family = entry["family"]
              ips = sample_ips(cidr, sample_ips_per_range)
              ip_results = []
              for ip in ips:
                  ok, detail = check_ip(ip)
                  ip_results.append({"ip": ip, "ok": ok, "detail": detail})
              range_ok = any(r["ok"] for r in ip_results)
              if not range_ok:
                  unusable_ranges += 1
              checks.append(
                  {
                      "family": family,
                      "cidr": cidr,
                      "usable_as_proxy": range_ok,
                      "samples": ip_results,
                  }
              )

          summary = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "target_host": TARGET_HOST,
              "target_path": TARGET_PATH,
              "config": {
                  "max_failures": max_failures,
                  "sample_ips_per_range": sample_ips_per_range,
                  "connect_timeout": connect_timeout,
              },
              "totals": {
                  "ranges": len(checks),
                  "usable_ranges": sum(1 for c in checks if c["usable_as_proxy"]),
                  "unusable_ranges": unusable_ranges,
              },
              "checks": checks,
          }

          with open(OUTPUT_JSON, "w", encoding="utf-8") as f:
              json.dump(summary, f, indent=2)

          lines = [
              "# Cloudflare Anycast Proxy Check",
              "",
              f"- Timestamp: `{summary['timestamp']}`",
              f"- Total ranges: `{summary['totals']['ranges']}`",
              f"- Usable ranges: `{summary['totals']['usable_ranges']}`",
              f"- Unusable ranges: `{summary['totals']['unusable_ranges']}`",
              f"- Max failures allowed: `{max_failures}`",
              "",
              "## Unusable ranges",
          ]
          bad = [c for c in checks if not c["usable_as_proxy"]]
          if not bad:
              lines.append("- None")
          else:
              for c in bad:
                  details = ", ".join(f"{s['ip']} ({s['detail']})" for s in c["samples"])
                  lines.append(f"- `{c['cidr']}` [{c['family']}]: {details}")

          lines.append("")
          lines.append("## Range results")
          lines.append("")
          lines.append("| CIDR | Family | Usable | Sample Results |")
          lines.append("|---|---|---:|---|")
          for c in checks:
              sample_text = "<br>".join(f"{s['ip']}: {'ok' if s['ok'] else 'fail'} ({s['detail']})" for s in c["samples"])
              lines.append(f"| `{c['cidr']}` | {c['family']} | {'✅' if c['usable_as_proxy'] else '❌'} | {sample_text} |")

          with open(OUTPUT_MD, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          if unusable_ranges > max_failures:
              raise SystemExit(
                  f"Unusable ranges ({unusable_ranges}) exceeded allowed max_failures ({max_failures})."
              )
          PY

      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-anycast-proxy-check-report
          path: |
            cloudflare-anycast-proxy-report.json
            cloudflare-anycast-proxy-report.md
